[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yse-type-ii-population"
version = "0.1.0"
description = "Data and scripts for YSE DR1 Type II supernova population / thesis sample work"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "C. Kilpatrick" }]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "astropy>=5.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "requests>=2.28",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
spectroscopy = [
    "pypeit>=1.14",
]
google = [
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
]
extrabol = [
    "scipy>=1.10",
    "matplotlib>=3.7",
    "astroquery>=0.4",
    "george>=0.4",
    "emcee>=3.0",
    "extinction>=0.4",
]
thesis = [
    "emcee>=3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["yse*"]
