[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yse-type-ii-population"
version = "0.3.0"
description = "YSE DR1 Type II supernovae: SNANA I/O, photometry pipelines, nickel analysis, BLAST host figures, and extrabol GP tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "C. Kilpatrick" }]
keywords = [
    "astronomy",
    "supernova",
    "YSE",
    "ZTF",
    "SNANA",
    "Type II",
    "light curve",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "astropy>=5.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "requests>=2.28",
    "python-dateutil>=2.8",
    "emcee>=3.0",
    "george>=0.4",
    "astroquery>=0.4",
    "extinction>=0.4",
    "light-curve>=0.7",
    "odrpack>=0.5",
]

[project.optional-dependencies]
extrabol-gp = ["synphot>=1.2", "numba>=0.57"]
ghost = ["astro-ghost>=2.0"]
google = [
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
]
spectroscopy = ["pypeit>=1.14"]
dev = ["pytest>=7.0", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["yse*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["yse"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
